[project]
name = "matrixcli"
version = "1.9"
description = "A terminal Matrix client with an unread-first home dashboard, end-to-end encryption, and macOS Keychain credentials"
authors = [{ name = "Eljakim" }]
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "textual (>=0.80.0,<9.0.0)",
    "matrix-nio[e2e] (>=0.26.0,<0.30.0)",
    "keyring (>=24.0,<26.0)",
]
# matrix-nio's e2e extra uses vodozemac (prebuilt Rust wheels), so it
# installs cleanly everywhere with no system crypto libraries.

[project.scripts]
matrix = "matrixcli.app:main"

[tool.poetry]
packages = [{ include = "matrixcli", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pyinstaller (>=6.0)"
]
